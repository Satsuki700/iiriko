<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>Satsuki700のScratch短縮リンクRedirecting...</title>
    <link rel="icon" href="https://pengs.onrender.com/favicon.png">
</head>
<body>
    <div style="text-align:center; margin-top:100px; font-family:sans-serif;">
        <h2>Satsuki700のScratch短縮リンク<br>リダイレクト中...</h2>
        <img src="https://uploads.scratch.mit.edu/get_image/project/1288040315_600x450.png" alt="Satsuki700挨拶">
        <p id="msg">読み込み中...</p>
        <p style="margin-top: 50px; font-size: 14px; color: #666;">&copy;2026 Satsuki700 All Rights Reserved.</p>
    </div>

    <script type="text/javascript">
        var BASE62 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

        function decodeBase62(str) {
            var num = 0;
            for (var i = 0; i < str.length; i++) {
                num = num * 62 + BASE62.indexOf(str.charAt(i));
            }
            return num;
        }

        (function() {
            var pathname = location.pathname;
            var segments = pathname.split('/');
            var pathSegments = [];
            for (var i = 0; i < segments.length; i++) {
                if (segments[i].length > 0 && segments[i] !== "index.html") {
                    pathSegments.push(decodeURIComponent(segments[i]));
                }
            }

            if (pathSegments.length === 0) {
                location.replace("./");
                return;
            }

            var codePath = "";
            for (var j = pathSegments.length - 1; j >= 0; j--) {
                var seg = pathSegments[j];
                // プレフィックス判定に '2' を追加
                if (seg.toUpperCase() === "O" || /^[2WTYIJDSMBUPF][a-zA-Z0-9_\-\/]*$/i.test(seg)) {
                    codePath = pathSegments.slice(j).join('/');
                    break;
                }
            }

            if (!codePath && pathSegments.length > 0) {
                codePath = pathSegments[pathSegments.length - 1];
            }

            var targetUrl = "";

            if (codePath) {
                var upperCode = codePath.toUpperCase();
                var prefix1 = upperCode.charAt(0);
                var prefix2 = upperCode.substring(0, 2);

                // 2文字プレフィックス（IT, IG, IU）の判定
                if (prefix2 === "IT" || prefix2 === "IG" || prefix2 === "IU") {
                    var prefix = prefix2;
                    var rest = codePath.substring(2);
                } else {
                    var prefix = prefix1;
                    var rest = codePath.substring(1);
                }

                // 1. Wiki: curid 形式 (W)
                if (prefix === "W") {
                    var idW = decodeBase62(rest);
                    targetUrl = "https://ja.scratch-wiki.info/w/index.php?curid=" + idW;
                } 
                // 2. Wiki: 従来の記事名形式 (2)
                else if (prefix === "2") {
                    targetUrl = "https://ja.scratch-wiki.info/wiki/" + rest;
                } 
                // 3. TurboWarp (T)
                else if (prefix === "T") {
                    var idT = decodeBase62(rest);
                    targetUrl = "https://turbowarp.org/" + idT;
                } 
                // 4. YouTube 埋め込み (Y)
                else if (prefix === "Y") {
                    targetUrl = "https://scratch.mit.edu/discuss/youtube/" + rest;
                } 
                // 5. 画像: プロジェクト (I)
                else if (prefix === "I") {
                    var idIT = decodeBase62(rest);
                    targetUrl = "https://uploads.scratch.mit.edu/get_image/project/" + idIT + "_1000x1000.png";
                } 
                else if (prefix === "IG") {
                    var idIG = decodeBase62(rest);
                    targetUrl = "https://uploads.scratch.mit.edu/galleries/thumbnails/" + idIG + ".png";
                } 
                else if (prefix === "IU") {
                    var idIU = decodeBase62(rest);
                    targetUrl = "https://uploads.scratch.mit.edu/get_image/user/" + idIU + "_400x400.png";
                } 
                // 6. 画像: ギャラリー/スタジオ (J)
                else if (prefix === "J") {
                    var idJ = decodeBase62(rest);
                    targetUrl = "https://uploads.scratch.mit.edu/galleries/thumbnails/" + idJ + ".png";
                } 
                // 7. フォーラムトップ (O)
                else if (upperCode === "O") {
                    targetUrl = "https://scratch.mit.edu/discuss/";
                } 
                // 8. フォーラムトピック (D)
                else if (prefix === "D") {
                    var partsD = rest.split("/C");
                    var topicId = decodeBase62(partsD[0]);
                    targetUrl = "https://scratch.mit.edu/discuss/topic/" + topicId;
                    if (partsD[1]) {
                        targetUrl += "#post-" + decodeBase62(partsD[1]);
                    }
                } 
                // 9. スタジオ (S)
                else if (prefix === "S") {
                    var idS = decodeBase62(rest);
                    targetUrl = "https://scratch.mit.edu/studios/" + idS;
                } 
                // 10. ユーザーページ & プロフィールコメント対応 (U)
                else if (prefix === "U") {
                    var partsU = rest.split("/C");
                    targetUrl = "https://scratch.mit.edu/users/" + partsU[0];
                    if (partsU[1]) {
                        targetUrl += "#comments-" + decodeBase62(partsU[1]);
                    }
                } 
                // 11. API: メッセージ数 (M)
                else if (prefix === "M") {
                    targetUrl = "https://api.scratch.mit.edu/users/" + rest + "/messages/count";
                } 
                // 12. API: ユーザー情報 (B)
                else if (prefix === "B") {
                    targetUrl = "https://api.scratch.mit.edu/users/" + rest;
                } 
                // 13. プロジェクト (P)
                else if (prefix === "P") {
                    var partsP = rest.split("/");
                    var idP = decodeBase62(partsP[0]);
                    targetUrl = "https://scratch.mit.edu/projects/" + idP;
                    if (partsP[1] && partsP[1].toUpperCase() === "E") {
                        targetUrl += "/editor";
                    } else if (partsP[1] === "埋") {
                        targetUrl += "/embed";
                    } else if (partsP[1] === "全") {
                        targetUrl += "/fullscreen";
                    } else if (partsP[1] && partsP[1].toUpperCase().indexOf("C") === 0) {
                        targetUrl += "#comments-" + decodeBase62(partsP[1].substring(1));
                    }
                } 
                // 14. ウェルカムメール (F直結)
                else if (prefix === "F") {
                    targetUrl = "https://scratch.mit.edu/emails/welcome/" + rest;
                }
            }

            if (targetUrl) {
                var msgEl = document.getElementById('msg');
                if (msgEl) {
                    msgEl.innerHTML = 'Scratchの目的の場所まで移動しています...';
                }
                location.replace(targetUrl);
            } else {
                var msgEl2 = document.getElementById('msg');
                if (msgEl2) {
                    msgEl2.innerText = "無効な短縮リンクです。";
                }
            }
        })();
    </script>
</body>
</html>
